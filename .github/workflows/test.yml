name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, non-secret workspace identity. `WorkspaceExecutor.getBaseDevEnv` reads these from
  # `process.env` and throws without them, which fails 8 cli tests that build temp workspaces.
  # Locally they come from the gitignored root `.env`; a runner has no such file.
  AKAN_PUBLIC_REPO_NAME: akanjs
  AKAN_PUBLIC_SERVE_DOMAIN: akanjs.com
  AKAN_PUBLIC_ENV: local

jobs:
  unit:
    name: unit ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every suite runs on Linux, which is what the fleet runs. devkit used to be pinned to macOS
        # because five of its tests failed in a 2-vCPU `oven/bun:1.3.14` container; four were
        # assumptions about the runner rather than product behaviour and are now fixed or skipped
        # where they do not apply, and the fifth was a real defect in `SourceMtimeIndex`.
        package:
          - pkgs/akanjs
          - pkgs/@akanjs/cli
          - pkgs/@akanjs/devkit
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the dev-server work is calibrated against 1.3.14 behaviours
          # (ipc flush-on-exit, recursive `fs.watch` event coalescing).
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # `--isolate` is required. Without it every test file shares one global object and dozens
      # fail from cross-file state pollution; `bunfig.toml`'s `[test] isolate` is not honoured as
      # of Bun 1.3. Running `bun test` from the repo root additionally breaks subprocess stdio.
      - run: bun test --isolate
        working-directory: ${{ matrix.package }}
